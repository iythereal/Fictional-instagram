<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>모먼트 | 가상 SNS</title><style>
:root{font-family:system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;color:#1d1d1f;background:#fafafa}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #ddd;padding:13px 16px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:25px;font-weight:750;letter-spacing:-1.5px}.wrap{max-width:560px;margin:auto;min-height:100vh;background:#fff;border-left:1px solid #eee;border-right:1px solid #eee;padding-bottom:68px}.iconbtn{border:0;background:none;font-size:22px;padding:5px}.storybar{display:flex;gap:15px;overflow:auto;padding:16px;border-bottom:1px solid #eee}.story{border:0;background:none;min-width:68px;text-align:center;font-size:12px}.avatar{width:43px;height:43px;border-radius:50%;background:linear-gradient(135deg,#ffd5ab,#ec85ac,#9c87e8);display:inline-grid;place-items:center;color:#fff;font-weight:700;flex-shrink:0}.story .avatar{width:62px;height:62px;border:3px solid #e75c94;outline:2px solid #fff;outline-offset:-5px}.post{border-bottom:1px solid #eee}.posthead{display:flex;align-items:center;gap:10px;padding:11px 13px}.username{font-weight:700;border:0;background:none;padding:0}.muted{color:#777;font-size:12px}.media{aspect-ratio:1/1;display:grid;place-items:center;text-align:center;padding:32px;background:linear-gradient(145deg,#fff1e4,#f9c9d6 52%,#b5a5db);color:#543e57;font-size:27px;font-weight:700;line-height:1.55;white-space:pre-line}.media.alt{background:linear-gradient(135deg,#d3e9f4,#c5d4f1,#f5e4d7);color:#34465b}.media.third{background:linear-gradient(135deg,#d5f0dd,#f4f0b8,#f1cbd7);color:#40594c}.actions{display:flex;gap:14px;padding:12px 14px 6px}.actions button{border:0;background:none;font-size:23px;padding:0}.content{padding:0 14px 14px;font-size:14px;line-height:1.55}.caption{margin-top:5px}.linkbtn{border:0;background:none;color:#777;padding:6px 0;font-size:13px}.comment{padding:9px 0;border-bottom:1px solid #f0f0f0;font-size:14px}.commentbox{display:flex;gap:7px;margin-top:12px}.commentbox input{flex:1;min-width:0;border:1px solid #ddd;border-radius:8px;padding:10px}.primary{border:0;background:#228de9;color:#fff;border-radius:8px;padding:10px 13px;font-weight:700}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);display:flex;justify-content:space-around;background:#fff;border-top:1px solid #ddd;padding:8px 0;z-index:6}.nav button{border:0;background:none;font-size:22px;padding:6px 18px}.profiletop{padding:20px 16px;display:flex;gap:20px;align-items:center}.profiletop .avatar{width:86px;height:86px;font-size:30px}.stats{display:flex;gap:17px;margin-top:10px;font-size:13px}.bio{padding:0 16px 20px;white-space:pre-line;font-size:14px}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}.tile{aspect-ratio:1;background:linear-gradient(135deg,#fae3e7,#c1b7e8);border:0;font-size:14px;color:#473e55;padding:10px;font-weight:700}.tile:nth-child(2n){background:linear-gradient(135deg,#d3e8ee,#e9d4bf)}.section{padding:16px}.back{border:0;background:none;font-weight:700;font-size:16px}.notice{background:#fff8e7;padding:12px;font-size:12px;color:#6d5b39}.empty{padding:35px;text-align:center;color:#777}.editor{padding:16px;border-top:1px solid #ddd}.editor textarea{width:100%;height:230px;padding:12px;border:1px solid #ddd;border-radius:8px;font-family:monospace;font-size:12px}.editor details{margin-top:14px}.editor summary{cursor:pointer;font-weight:700}.editor button{margin-top:8px}.help{font-size:13px;color:#555;line-height:1.6}.storymodal{position:fixed;inset:0;background:#191923;z-index:20;display:grid;place-items:center;padding:18px}.storycard{width:min(430px,100%);min-height:65vh;background:linear-gradient(140deg,#f7c2d5,#b5a5e6);border-radius:16px;padding:20px;display:flex;flex-direction:column;justify-content:space-between;color:#272033}.storytext{font-size:26px;text-align:center;font-weight:750;white-space:pre-line}.storyclose{align-self:flex-end;background:#fff;border:0;border-radius:50%;width:35px;height:35px}.small{font-size:12px;color:#666}
</style></head><body><div class="wrap"><header><button class="back" id="back" style="display:none" onclick="goHome()">←</button><div class="logo" id="title">moment</div><button class="iconbtn" onclick="showEditor()" title="콘텐츠 편집">⚙</button></header><div id="app"></div><nav class="nav"><button onclick="goHome()" title="홈">⌂</button><button onclick="showExplore()" title="탐색">⌕</button><button onclick="showProfile(DATA.users[0].id)" title="프로필">♙</button><button onclick="showEditor()" title="편집">✎</button></nav></div><div id="storyoverlay"></div>
<script>
// ★ 여기의 인물과 게시물 내용을 자유롭게 바꿀 수 있어요.
const DEFAULT_DATA={users:[
{id:'seoryeong',name:'서령',bio:'하고 싶은 말은 하고 삽니다. 🌷',avatar:'서',story:'오늘은 꼭 참으려고 했는데\n또 실패했다.'},
{id:'muhun',name:'무헌',bio:'대체로 조용한 편. 누군가는 동의하지 않겠지만.',avatar:'무',story:'누가 화가 난 것 같습니다.\n이유는 모르겠습니다.'},
{id:'migyeong',name:'미경',bio:'기록하는 사람 📷',avatar:'미',story:'오늘의 관찰 기록:\n둘이 또 싸움.'}
],posts:[
{id:1,user:'seoryeong',location:'작은 찻집',imageText:'오늘은\n좋은 날이기를 🌸',style:'',caption:'좋은 하루 보내려 했는데 누가 또 말을 걸었다.',likes:127,comments:[{user:'migyeong',text:'누군지 너무 알겠는데 ㅋㅋ'},{user:'muhun',text:'우연히 지나갔을 뿐입니다.'}]},
{id:2,user:'muhun',location:'골목길',imageText:'해 질 무렵',style:'alt',caption:'날씨가 좋군요. 어떤 분은 기분이 좋지 않으신 모양이지만.',likes:89,comments:[{user:'seoryeong',text:'그쪽 때문이겠죠.'}]},
{id:3,user:'migyeong',location:'동네 어딘가',imageText:'오늘의 기록 📷',style:'third',caption:'친구들아 제발 조용히 좀 지내자.',likes:213,comments:[{user:'seoryeong',text:'난 조용했어.'},{user:'muhun',text:'저도 그렇습니다.'}]}
]};
const STORAGE='fiction_moment_v1';let DATA;try{DATA=JSON.parse(localStorage.getItem(STORAGE))||structuredClone(DEFAULT_DATA)}catch{DATA=structuredClone(DEFAULT_DATA)};let likes={};let page='feed';const el=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const user=id=>DATA.users.find(u=>u.id===id)||{id,name:id,avatar:'?',bio:''};function avatar(u){return `<span class="avatar">${esc(u.avatar||u.name.slice(0,1))}</span>`}function shell(title,back=true){document.getElementById('title').textContent=title;document.getElementById('back').style.display=back?'block':'none'}function goHome(){page='feed';shell('moment',false);el.innerHTML=`<div class="notice">이 페이지는 창작용 가상 SNS이며 실제 인스타그램과 관계없습니다.</div><div class="storybar">${DATA.users.map(u=>`<button class="story" onclick="showStory('${esc(u.id)}')">${avatar(u)}<div>${esc(u.name)}</div></button>`).join('')}</div>`+DATA.posts.map(p=>postCard(p)).join('')}function postCard(p){let u=user(p.user);return `<article class="post"><div class="posthead">${avatar(u)}<div><button class="username" onclick="showProfile('${esc(u.id)}')">${esc(u.name)}</button><div class="muted">${esc(p.location||'')} · @${esc(u.id)}</div></div></div><div class="media ${esc(p.style||'')}" onclick="showPost(${p.id})">${esc(p.imageText)}</div><div class="actions"><button onclick="toggleLike(${p.id})" id="heart-${p.id}">${likes[p.id]?'♥':'♡'}</button><button onclick="showPost(${p.id})">♧</button><button onclick="copyPost(${p.id})">↗</button></div><div class="content"><strong id="likes-${p.id}">${(p.likes||0)+(likes[p.id]?1:0)}명이 좋아합니다</strong><div class="caption"><b>${esc(u.name)}</b> ${esc(p.caption)}</div><button class="linkbtn" onclick="showPost(${p.id})">댓글 ${p.comments.length}개 모두 보기</button></div></article>`}function showPost(id){page='post';let p=DATA.posts.find(x=>x.id===id);if(!p)return goHome();shell('게시물');el.innerHTML=postCard(p)+`<section class="section"><h3>댓글</h3>${p.comments.map(c=>`<div class="comment"><button class="username" onclick="showProfile('${esc(c.user)}')">${esc(user(c.user).name)}</button> ${esc(c.text)}</div>`).join('')}<form class="commentbox" onsubmit="addComment(event,${id})"><input name="text" placeholder="댓글을 입력하세요 (내 화면에만 표시)" required maxlength="300"><button class="primary">게시</button></form><p class="small">작성한 댓글은 이 브라우저에만 저장돼요.</p></section>`}function showProfile(id){page='profile';let u=user(id);shell(u.name);let posts=DATA.posts.filter(p=>p.user===id);el.innerHTML=`<div class="profiletop">${avatar(u)}<div><strong>@${esc(u.id)}</strong><div class="stats"><span><b>${posts.length}</b> 게시물</span><span>가상 계정</span></div></div></div><div class="bio"><b>${esc(u.name)}</b>\n${esc(u.bio)}</div><div class="tiles">${posts.map(p=>`<button class="tile" onclick="showPost(${p.id})">${esc(p.imageText)}</button>`).join('')}</div>${posts.length?'':'<div class="empty">게시물이 없어요.</div>'}`}function showExplore(){page='explore';shell('탐색');el.innerHTML='<div class="section"><h3>등장인물</h3>'+DATA.users.map(u=>`<div class="posthead">${avatar(u)}<button class="username" onclick="showProfile('${esc(u.id)}')">${esc(u.name)} · @${esc(u.id)}</button></div>`).join('')+'</div><div class="tiles">'+DATA.posts.map(p=>`<button class="tile" onclick="showPost(${p.id})">${esc(p.imageText)}</button>`).join('')+'</div>'}function showStory(id){let u=user(id);document.getElementById('storyoverlay').innerHTML=`<div class="storymodal"><div class="storycard"><button class="storyclose" onclick="closeStory()">✕</button><div class="storytext">${esc(u.story||'새로운 스토리가 없습니다.')}</div><b>@${esc(u.id)}</b></div></div>`}function closeStory(){document.getElementById('storyoverlay').innerHTML=''}function toggleLike(id){likes[id]=!likes[id];let h=document.getElementById('heart-'+id),n=document.getElementById('likes-'+id),p=DATA.posts.find(x=>x.id===id);if(h)h.textContent=likes[id]?'♥':'♡';if(n)n.textContent=((p.likes||0)+(likes[id]?1:0))+'명이 좋아합니다'}function addComment(e,id){e.preventDefault();let text=e.target.elements.text.value.trim();if(!text)return;DATA.posts.find(p=>p.id===id).comments.push({user:'reader',text});DATA.users.some(u=>u.id==='reader')||DATA.users.push({id:'reader',name:'독자',avatar:'독',bio:'방문자'});localStorage.setItem(STORAGE,JSON.stringify(DATA));showPost(id)}function copyPost(id){let p=DATA.posts.find(x=>x.id===id);navigator.clipboard?.writeText(user(p.user).name+': '+p.caption).then(()=>alert('게시물 내용이 복사됐어요.')).catch(()=>alert('복사 기능을 지원하지 않는 브라우저예요.'))}function showEditor(){page='editor';shell('콘텐츠 편집');el.innerHTML=`<div class="editor"><h2>✎ 연성 편집기</h2><p class="help">아래 JSON에서 등장인물 이름, 아이디, 프로필, 게시물, 댓글을 바꿀 수 있어. <b>저장</b>은 현재 브라우저에만 적용돼. 다른 독자에게 보이도록 배포하려면 수정한 내용을 코드의 <code>DEFAULT_DATA</code>에 반영한 뒤 index.html을 다시 업로드해야 해.</p><textarea id="jsonarea" spellcheck="false"></textarea><button class="primary" onclick="saveEdit()">이 브라우저에 저장하고 미리보기</button> <button onclick="downloadJson()">JSON 내려받기</button> <button onclick="resetData()">예시로 초기화</button><details><summary>편집 방법</summary><p class="help">users에 인물을 추가하고, posts의 user에 해당 인물 id를 입력해. imageText는 이미지 대신 표시되는 문구야. style은 빈 문자열, alt, third 중 하나를 사용해. 게시물 id는 서로 다른 숫자로 설정해. JSON에서는 따옴표와 쉼표를 정확히 입력해야 해.</p></details></div>`;document.getElementById('jsonarea').value=JSON.stringify(DATA,null,2)}function saveEdit(){try{let next=JSON.parse(document.getElementById('jsonarea').value);if(!Array.isArray(next.users)||!Array.isArray(next.posts))throw Error('users와 posts 배열이 필요합니다.');DATA=next;localStorage.setItem(STORAGE,JSON.stringify(DATA));alert('이 브라우저에 저장했어요.');goHome()}catch(e){alert('JSON 형식을 확인해 주세요: '+e.message)}}function downloadJson(){let blob=new Blob([document.getElementById('jsonarea').value],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sns-content.json';a.click();URL.revokeObjectURL(a.href)}function resetData(){if(confirm('이 브라우저의 편집 내용을 초기화할까요?')){localStorage.removeItem(STORAGE);DATA=structuredClone(DEFAULT_DATA);showEditor()}}goHome();
</script></body></html>
