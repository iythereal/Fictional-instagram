<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>moment — 창작용 SNS</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;color:#24242a;background:#f6f5f7}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.5}.app{max-width:560px;margin:auto;background:#fff;min-height:100vh;padding-bottom:75px;box-shadow:0 0 35px #ddd7}header{position:sticky;top:0;z-index:4;background:#fff;border-bottom:1px solid #eee;padding:13px 16px;display:flex;align-items:center;justify-content:space-between}.logo{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;font-style:normal;font-size:25px;font-weight:750;letter-spacing:-1.5px}.plain{border:0;background:none;color:inherit;padding:6px}.topbtn{font-size:21px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);z-index:5;background:white;border-top:1px solid #eee;display:flex;justify-content:space-around;padding:10px}.nav button{border:0;background:none;font-size:22px}.hint{background:#fff7e9;color:#76592c;padding:10px 15px;font-size:12px}.stories{display:flex;gap:13px;padding:15px;overflow:auto;border-bottom:1px solid #eee}.story{border:0;background:none;min-width:64px;font-size:12px}.avatar{width:43px;height:43px;border-radius:50%;background:linear-gradient(140deg,#f4b6c5,#a08acb);display:inline-flex;align-items:center;justify-content:center;color:white;font-weight:bold;overflow:hidden;flex-shrink:0}.avatar img{width:100%;height:100%;object-fit:cover}.story .avatar{width:62px;height:62px;border:3px solid #e95793;padding:2px}.post{border-bottom:1px solid #eee}.posthead{display:flex;align-items:center;gap:10px;padding:12px 14px}.posthead .info{flex:1}.handle{font-size:13px;font-weight:700}.muted{font-size:12px;color:#85838c}.media{aspect-ratio:1/1;background:linear-gradient(145deg,#f9e2ed,#c2b7e7);display:grid;place-items:center;position:relative;overflow:hidden}.media img{width:100%;height:100%;object-fit:cover}.placeholder{font-size:24px;white-space:pre-line;text-align:center;padding:20px;color:#51435c;font-weight:700}.arrows{position:absolute;top:45%;border:0;background:#fffdef;border-radius:50%;width:34px;height:34px;box-shadow:0 1px 6px #7775;font-size:23px}.left{left:10px}.right{right:10px}.counter{position:absolute;top:12px;right:12px;background:#2229;color:white;padding:5px 8px;border-radius:12px;font-size:11px}.actions{display:flex;gap:15px;padding:10px 14px}.actions button{border:0;background:none;font-size:23px;padding:0}.caption{padding:0 14px 14px;font-size:14px;line-height:1.6;white-space:pre-wrap}.caption button{border:0;background:none;color:#888;padding:7px 0}.profile{display:flex;gap:20px;padding:22px 16px}.profile .avatar{width:88px;height:88px;font-size:26px}.bio{padding:0 16px 18px;font-size:14px;white-space:pre-wrap}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}.tile{aspect-ratio:1;border:0;background:#f0dce9;padding:0;overflow:hidden}.tile img{width:100%;height:100%;object-fit:cover}.tile span{font-size:12px}.section{padding:17px}.comment{padding:11px 0;border-bottom:1px solid #eee;font-size:14px}.panel{padding:17px}.panel h2{font-size:21px;margin:5px 0 14px}.panel h3{font-size:16px;margin:20px 0 8px}.field{display:block;margin:11px 0;font-size:13px;font-weight:600}.field input,.field textarea,.field select{display:block;width:100%;border:1px solid #ddd;border-radius:10px;padding:11px;margin-top:6px;background:white;color:#222}.field textarea{min-height:90px;resize:vertical}.btn{border:1px solid #ddd;border-radius:9px;background:white;padding:10px 13px;margin:4px 4px 4px 0}.primary{background:#2586e6;border-color:#2586e6;color:white;font-weight:bold}.danger{color:#ba3653}.cards{display:flex;flex-wrap:wrap;gap:8px}.smallcard{border:1px solid #eee;border-radius:10px;padding:12px;text-align:left;background:#fff;min-width:110px}.small{font-size:12px;color:#777;line-height:1.6}.thumb{height:80px;width:80px;object-fit:cover;border-radius:8px;background:#eee}.preview{display:flex;gap:9px;flex-wrap:wrap;margin-top:8px}.preview>div{position:relative}.preview button{position:absolute;right:0;top:0;background:#fff;border:0;border-radius:50%}.overlay{position:fixed;inset:0;background:#171620ed;z-index:20;display:flex;align-items:center;justify-content:center;padding:15px}.storyview{width:min(450px,100%);height:min(80vh,740px);border-radius:16px;overflow:hidden;background:linear-gradient(135deg,#eeb5d3,#a9a4e2);position:relative;display:flex;align-items:center;justify-content:center;color:white}.storyview img{width:100%;height:100%;object-fit:cover;position:absolute}.storyview .storywords{z-index:1;background:#0005;padding:20px;text-align:center;white-space:pre-wrap;font-size:23px}.storyview .close{position:absolute;z-index:2;right:12px;top:12px;border:0;background:#fff;border-radius:50%;width:35px;height:35px}.storyview .storyname{position:absolute;z-index:2;left:15px;top:15px;font-weight:bold;text-shadow:0 1px 4px #333}.back{font-size:18px}.divider{height:1px;background:#eee;margin:17px 0}.warning{font-size:12px;color:#9b6331;background:#fff6e8;border-radius:9px;padding:12px}.empty{padding:40px;text-align:center;color:#777}
</style></head><body><div class="app"><header><button class="plain back" id="back" onclick="home()" hidden>←</button><span class="logo" id="heading">moment</span><button class="plain topbtn" onclick="editor()" title="편집">⚙</button></header><main id="root"></main><nav class="nav"><button onclick="home()" title="홈">⌂</button><button onclick="explore()" title="탐색">⌕</button><button onclick="profile(DATA.users[0]?.id)" title="프로필">♙</button><button onclick="editor()" title="편집">✎</button></nav></div><div id="modal"></div>
<script id="published-data" type="application/json">{"users":[{"id":"seoryeong","name":"서령","bio":"평온한 하루를 원합니다 🌷","avatar":"","storyText":"오늘은 정말 참으려고 했는데...","storyImage":""},{"id":"muhun","name":"무헌","bio":"말을 아끼는 편입니다. 아마도.","avatar":"","storyText":"누군가 저를 오해하는 듯합니다.","storyImage":""},{"id":"migyeong","name":"미경","bio":"사진과 기록 📷","avatar":"","storyText":"오늘도 두 사람이 싸움","storyImage":""}],"posts":[{"id":1,"user":"seoryeong","location":"어느 카페","caption":"오늘 하루도 쉽지 않다.","images":[],"placeholder":"오늘의 기록 🌸","likes":128,"comments":[{"user":"migyeong","text":"무슨 일인데 ㅋㅋ"},{"user":"muhun","text":"억울합니다."}]},{"id":2,"user":"muhun","location":"동네 골목","caption":"날씨는 좋군요.","images":[],"placeholder":"노을지는 오후","likes":94,"comments":[{"user":"seoryeong","text":"그렇겠죠."}]}]}</script>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PUBLISHED=JSON.parse($('#published-data').textContent);const STORE='moment_editor_v2';let DATA;try{DATA=JSON.parse(localStorage.getItem(STORE))||structuredClone(PUBLISHED)}catch{DATA=structuredClone(PUBLISHED)};let likes={}, slides={}, page='home', editing=null;const root=$('#root');
function save(){try{localStorage.setItem(STORE,JSON.stringify(DATA));return true}catch(e){alert('브라우저 저장 공간이 부족해요. 사진을 더 작게 넣거나 HTML 파일로 내보내세요.');return false}}
function user(id){return DATA.users.find(x=>x.id===id)||{id,name:id||'알 수 없음',bio:'',avatar:''}}
function av(u){return '<span class="avatar">'+(u.avatar?'<img src="'+esc(u.avatar)+'" alt="">':esc((u.name||'?').slice(0,1)))+'</span>'}
function shell(name,back=true){$('#heading').textContent=name;$('#back').hidden=!back;window.scrollTo(0,0)}
function home(){page='home';shell('moment',false);root.innerHTML='<div class="hint">창작용 가상 SNS입니다. 실제 인스타그램과 무관합니다.</div><div class="stories">'+DATA.users.map(u=>'<button class="story" onclick="story('+JSON.stringify(u.id).replace(/"/g,'&quot;')+')">'+av(u)+'<div>'+esc(u.name)+'</div></button>').join('')+'</div>'+DATA.posts.map(card).join('')}
function media(p){let i=slides[p.id]||0,images=p.images||[];return '<div class="media" onclick="post('+p.id+')">'+(images.length?'<img src="'+esc(images[Math.min(i,images.length-1)])+'" alt="게시물 이미지">':'<div class="placeholder">'+esc(p.placeholder||'사진 없음')+'</div>')+(images.length>1?'<span class="counter">'+(i+1)+' / '+images.length+'</span>'+(i>0?'<button class="arrows left" onclick="event.stopPropagation();slide('+p.id+',-1)">‹</button>':'')+(i<images.length-1?'<button class="arrows right" onclick="event.stopPropagation();slide('+p.id+',1)">›</button>':''):'')+'</div>'}
function card(p){let u=user(p.user);return '<article class="post"><div class="posthead">'+av(u)+'<div class="info"><button class="plain handle" onclick="profile('+JSON.stringify(u.id).replace(/"/g,'&quot;')+')">'+esc(u.id)+'</button><div class="muted">'+esc(p.location||'')+'</div></div></div>'+media(p)+'<div class="actions"><button onclick="like('+p.id+')" style="color:'+(likes[p.id]?'#e43c62':'inherit')+'">'+(likes[p.id]?'♥':'♡')+'</button><button onclick="post('+p.id+')">♧</button></div><div class="caption"><b>'+(Number(p.likes)||0)+(likes[p.id]?1:0)+'명이 좋아합니다</b>\n<b>'+esc(u.id)+'</b> '+esc(p.caption)+'\n<button onclick="post('+p.id+')">댓글 '+(p.comments||[]).length+'개 모두 보기</button></div></article>'}
function slide(id,delta){let p=DATA.posts.find(x=>x.id===id);slides[id]=Math.max(0,Math.min((p.images||[]).length-1,(slides[id]||0)+delta));renderAgain()}
function renderAgain(){if(page==='home')home();else if(page.startsWith('post:'))post(Number(page.split(':')[1]));else if(page.startsWith('profile:'))profile(page.slice(8));else explore()}
function like(id){likes[id]=!likes[id];renderAgain()}
function post(id){let p=DATA.posts.find(x=>x.id===id);if(!p)return home();page='post:'+id;shell('게시물');root.innerHTML=card(p)+'<div class="section"><h3>댓글</h3>'+(p.comments||[]).map(c=>'<div class="comment"><b>'+esc(user(c.user).name)+'</b> '+esc(c.text)+'</div>').join('')+'<p class="small">독자용 미리보기에서는 댓글을 읽을 수 있어요.</p></div>'}
function profile(id){let u=user(id);page='profile:'+id;shell(u.name);let posts=DATA.posts.filter(p=>p.user===id);root.innerHTML='<div class="profile">'+av(u)+'<div><b>@'+esc(u.id)+'</b><p class="small">게시물 '+posts.length+'개</p></div></div><div class="bio"><b>'+esc(u.name)+'</b>\n'+esc(u.bio)+'</div><div class="tiles">'+posts.map(p=>'<button class="tile" onclick="post('+p.id+')">'+(p.images?.length?'<img src="'+esc(p.images[0])+'" alt="">':'<span>'+esc(p.placeholder||'게시물')+'</span>')+'</button>').join('')+'</div>'+(posts.length?'':'<div class="empty">게시물이 없어요.</div>')}
function explore(){page='explore';shell('탐색');root.innerHTML='<div class="section"><h3>등장인물</h3>'+DATA.users.map(u=>'<div class="posthead">'+av(u)+'<button class="plain" onclick="profile('+JSON.stringify(u.id).replace(/"/g,'&quot;')+')">'+esc(u.name)+' · @'+esc(u.id)+'</button></div>').join('')+'</div><div class="tiles">'+DATA.posts.map(p=>'<button class="tile" onclick="post('+p.id+')">'+(p.images?.length?'<img src="'+esc(p.images[0])+'">':'<span>'+esc(p.placeholder||'게시물')+'</span>')+'</button>').join('')+'</div>'}
function story(id){let u=user(id);$('#modal').innerHTML='<div class="overlay"><div class="storyview">'+(u.storyImage?'<img src="'+esc(u.storyImage)+'">':'')+'<b class="storyname">@'+esc(u.id)+'</b><button class="close" onclick="closeStory()">✕</button><div class="storywords">'+esc(u.storyText||'오늘의 스토리')+'</div></div></div>'}
function closeStory(){$('#modal').innerHTML=''}
function editor(){page='editor';shell('쉬운 편집기');root.innerHTML='<div class="panel"><h2>✎ 연성 편집</h2><p class="small">글을 입력하고 사진을 고르면 돼. 작업이 끝나면 <b>독자용 HTML 내보내기</b>를 눌러 GitHub에 올려줘.</p><h3>등장인물</h3><div class="cards">'+DATA.users.map((u,i)=>'<button class="smallcard" onclick="editUser('+i+')">'+av(u)+'<div><b>'+esc(u.name)+'</b></div><div class="small">@'+esc(u.id)+'</div></button>').join('')+'</div><button class="btn primary" onclick="editUser(-1)">+ 등장인물 추가</button><h3>게시물</h3><div class="cards">'+DATA.posts.map((p,i)=>'<button class="smallcard" onclick="editPost('+i+')"><div><b>@'+esc(p.user)+'</b></div><div class="small">'+esc((p.caption||'').slice(0,35))+'</div><div class="small">사진 '+(p.images||[]).length+'장 · 댓글 '+(p.comments||[]).length+'개</div></button>').join('')+'</div><button class="btn primary" onclick="editPost(-1)">+ 게시물 추가</button><div class="divider"></div><h3>독자에게 공개하기</h3><p class="small">수정 내용은 현재 브라우저에 임시 저장돼. 아래 버튼으로 완성된 HTML을 다운로드해서 GitHub의 기존 index.html을 교체하면 독자에게도 적용돼.</p><button class="btn primary" onclick="exportHtml()">⬇ 독자용 HTML 내보내기</button><button class="btn" onclick="exportJson()">백업 JSON 받기</button><label class="field">백업 불러오기<input type="file" accept=".json,application/json" onchange="importJson(this.files[0])"></label><p class="warning">사진을 많이 넣으면 HTML 파일이 커질 수 있어. 사진은 자동으로 크기를 줄여 저장하지만, 중요한 원본 사진은 별도로 보관해 줘. 사이트를 공개하면 업로드한 사진도 공개돼.</p><button class="btn danger" onclick="resetAll()">예시 콘텐츠로 초기화</button></div>'}
function editUser(i){editing=i;let u=i<0?{id:'',name:'',bio:'',avatar:'',storyText:'',storyImage:''}:DATA.users[i];page='edit-user';shell(i<0?'등장인물 추가':'등장인물 수정');root.innerHTML='<div class="panel"><label class="field">이름<input id="uname" value="'+esc(u.name)+'" placeholder="서령"></label><label class="field">아이디 (영문/숫자/밑줄)<input id="uid" value="'+esc(u.id)+'" placeholder="seoryeong"></label><label class="field">프로필 소개<textarea id="ubio">'+esc(u.bio)+'</textarea></label><label class="field">스토리 글<textarea id="ustory">'+esc(u.storyText)+'</textarea></label><label class="field">프로필 사진<input type="file" accept="image/*" onchange="setImageField(\'avatar\',this.files[0])"></label><div id="avatarPreview" class="preview">'+(u.avatar?'<img class="thumb" src="'+esc(u.avatar)+'">':'<span class="small">사진 없음</span>')+'</div><button class="btn" onclick="clearField(\'avatar\')">프로필 사진 지우기</button><label class="field">스토리 사진<input type="file" accept="image/*" onchange="setImageField(\'storyImage\',this.files[0])"></label><div id="storyImagePreview" class="preview">'+(u.storyImage?'<img class="thumb" src="'+esc(u.storyImage)+'">':'<span class="small">사진 없음</span>')+'</div><button class="btn" onclick="clearField(\'storyImage\')">스토리 사진 지우기</button><div class="divider"></div><button class="btn primary" onclick="saveUser()">저장</button><button class="btn" onclick="editor()">취소</button>'+(i>=0?'<button class="btn danger" onclick="deleteUser()">등장인물 삭제</button>':'')+'</div>';window.userDraft={...u}}
function clearField(key){userDraft[key]='';$('#'+key+'Preview').innerHTML='<span class="small">사진 없음</span>'}
async function setImageField(key,file){if(!file)return;try{userDraft[key]=await shrink(file);$('#'+key+'Preview').innerHTML='<img class="thumb" src="'+esc(userDraft[key])+'">'}catch(e){alert('이미지를 읽지 못했어: '+e.message)}}
function saveUser(){let id=$('#uid').value.trim(),name=$('#uname').value.trim();if(!/^[a-zA-Z0-9_]{2,30}$/.test(id))return alert('아이디는 영문, 숫자, 밑줄로 2~30자 입력해 줘.');if(!name)return alert('이름을 입력해 줘.');if(DATA.users.some((u,j)=>j!==editing&&u.id===id))return alert('이미 사용 중인 아이디야.');let old=editing>=0?DATA.users[editing].id:null;let u={...userDraft,id,name,bio:$('#ubio').value,storyText:$('#ustory').value};if(editing<0)DATA.users.push(u);else DATA.users[editing]=u;if(old&&old!==id){DATA.posts.forEach(p=>{if(p.user===old)p.user=id;(p.comments||[]).forEach(c=>{if(c.user===old)c.user=id})})}save();editor()}
function deleteUser(){if(DATA.users.length===1)return alert('등장인물은 최소 한 명 필요해.');if(!confirm('등장인물을 삭제할까? 해당 인물의 게시물도 삭제돼.'))return;let id=DATA.users[editing].id;DATA.users.splice(editing,1);DATA.posts=DATA.posts.filter(p=>p.user!==id);save();editor()}
function editPost(i){editing=i;let p=i<0?{id:Date.now(),user:DATA.users[0]?.id,location:'',caption:'',images:[],placeholder:'새 게시물',likes:0,comments:[]}:DATA.posts[i];window.postDraft=structuredClone(p);page='edit-post';shell(i<0?'게시물 추가':'게시물 수정');root.innerHTML='<div class="panel"><label class="field">게시자<select id="puser">'+DATA.users.map(u=>'<option value="'+esc(u.id)+'" '+(p.user===u.id?'selected':'')+'>'+esc(u.name)+' (@'+esc(u.id)+')</option>').join('')+'</select></label><label class="field">위치<input id="plocation" value="'+esc(p.location)+'" placeholder="어느 카페"></label><label class="field">게시물 글<textarea id="pcaption">'+esc(p.caption)+'</textarea></label><label class="field">사진 없이 표시할 문구<input id="pplaceholder" value="'+esc(p.placeholder||'')+'"></label><label class="field">기본 좋아요 수<input type="number" min="0" id="plikes" value="'+(Number(p.likes)||0)+'"></label><h3>게시물 사진 (여러 장 가능)</h3><label class="field">아이패드 사진 보관함에서 선택<input type="file" accept="image/*" multiple onchange="addPhotos(this.files)"></label><div id="photoPreview" class="preview"></div><h3>가상 댓글</h3><div id="commentList"></div><button class="btn" onclick="addCommentField()">+ 댓글 추가</button><div class="divider"></div><button class="btn primary" onclick="savePost()">게시물 저장</button><button class="btn" onclick="editor()">취소</button>'+(i>=0?'<button class="btn danger" onclick="deletePost()">게시물 삭제</button>':'')+'</div>';renderPhotos();renderComments()}
function renderPhotos(){$('#photoPreview').innerHTML=(postDraft.images||[]).map((src,i)=>'<div><img class="thumb" src="'+esc(src)+'"><button onclick="removePhoto('+i+')">✕</button></div>').join('')||'<span class="small">아직 사진이 없어. 사진을 여러 장 고르면 넘기는 게시물이 돼.</span>'}
async function addPhotos(files){for(let file of Array.from(files||[])){try{postDraft.images.push(await shrink(file))}catch(e){alert(file.name+' 처리 실패: '+e.message)}}renderPhotos()}
function removePhoto(i){postDraft.images.splice(i,1);renderPhotos()}
function renderComments(){$('#commentList').innerHTML=(postDraft.comments||[]).map((c,i)=>'<div class="field" style="border:1px solid #eee;border-radius:10px;padding:10px"><select id="cuser'+i+'">'+DATA.users.map(u=>'<option value="'+esc(u.id)+'" '+(u.id===c.user?'selected':'')+'>'+esc(u.name)+'</option>').join('')+'</select><textarea id="ctext'+i+'">'+esc(c.text)+'</textarea><button class="btn danger" onclick="removeComment('+i+')">이 댓글 삭제</button></div>').join('')||'<p class="small">아직 댓글이 없어.</p>'}
function syncComments(){postDraft.comments=(postDraft.comments||[]).map((c,i)=>({user:$('#cuser'+i)?.value||c.user,text:$('#ctext'+i)?.value??c.text}))}
function addCommentField(){syncComments();postDraft.comments.push({user:DATA.users[0].id,text:''});renderComments()}
function removeComment(i){syncComments();postDraft.comments.splice(i,1);renderComments()}
function savePost(){syncComments();postDraft.user=$('#puser').value;postDraft.location=$('#plocation').value;postDraft.caption=$('#pcaption').value;postDraft.placeholder=$('#pplaceholder').value;postDraft.likes=Math.max(0,Number($('#plikes').value)||0);if(editing<0)DATA.posts.unshift(postDraft);else DATA.posts[editing]=postDraft;save();editor()}
function deletePost(){if(confirm('이 게시물을 삭제할까?')){DATA.posts.splice(editing,1);save();editor()}}
function shrink(file){return new Promise((resolve,reject)=>{if(!file.type.startsWith('image/'))return reject(Error('이미지 파일만 선택할 수 있어.'));let img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{let scale=Math.min(1,1100/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);URL.revokeObjectURL(url);resolve(canvas.toDataURL('image/jpeg',.76))};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('이미지 형식을 확인해 줘.'))};img.src=url})}
function download(blob,name){let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function exportHtml(){let html='<!doctype html>\n'+document.documentElement.outerHTML;let json=JSON.stringify(DATA).replace(/</g,'\\u003c');html=html.replace(/(<script id="published-data" type="application\/json">)[\s\S]*?(<\/script>)/,'$1'+json+'$2');download(new Blob([html],{type:'text/html;charset=utf-8'}),'index.html');alert('index.html 파일을 만들었어! GitHub에 기존 index.html 대신 업로드하면 독자들도 수정된 내용을 볼 수 있어.')}function exportJson(){download(new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'}),'moment-backup.json')}
async function importJson(file){if(!file)return;try{let data=JSON.parse(await file.text());if(!Array.isArray(data.users)||!Array.isArray(data.posts))throw Error('올바른 백업이 아니야.');if(confirm('현재 편집 내용을 백업 파일로 바꿀까?')){DATA=data;save();editor()}}catch(e){alert('백업을 열 수 없어: '+e.message)}}
function resetAll(){if(confirm('현재 브라우저에서 편집한 내용을 초기화할까?')){DATA=structuredClone(PUBLISHED);localStorage.removeItem(STORE);editor()}}
home();
</script></body></html>
